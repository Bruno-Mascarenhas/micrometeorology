repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # --enforce-all because CI is the only place pre-commit runs here, via
      # `pre-commit run --all-files` on a fresh checkout. Without it the hook
      # intersects its file list with the STAGED ADDITIONS, which are empty
      # there, so it inspected nothing and always passed — the 500 kB budget was
      # enforced in neither direction. `legacy/` is excluded because its two
      # notebooks (600 kB and 516 kB) predate the rule and are off-limits.
      - id: check-added-large-files
        args: ["--maxkb=500", "--enforce-all"]
        exclude: ^legacy/
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3  # frozen: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      # RUF200 (invalid-pyproject-toml) is default-on and ruff's own `include`
      # already covers `**/pyproject.toml`, but the upstream hook only passes
      # python/pyi/jupyter — so CI, which runs only pre-commit, never evaluates
      # it while `make check`'s bare `ruff check .` does. Same local/CI drift
      # the ruff-format override below fixes. No --fix: RUF200 has no autofix.
      - id: ruff-check
        alias: ruff-check-pyproject
        name: ruff check (pyproject.toml schema)
        types_or: [toml]
        files: ^pyproject\.toml$
      # Ruff 0.16 formats Python code blocks inside Markdown, but the upstream
      # hook only passes python/pyi/jupyter — which would leave `make fix`
      # rewriting docs/ that CI never checks. Widen it so the hook stays the
      # single source of truth for `ruff format .`.
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]
