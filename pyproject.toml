[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "labmim-micrometeorology"
version = "1.3.1"
description = "LabMiM/UFBA micrometeorology data processing, WRF output analysis, solar radiation bias correction, and ML-based model evaluation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
authors = [
    {name = "Bruno Mascarenhas", email = "brunomasck@gmail.com"},
    {name = "LabMiM - UFBA"},
]
keywords = ["micrometeorology", "WRF", "netcdf", "cartopy", "geospatial", "solar-radiation", "bias-correction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0.5",
    "xarray>=2024.6",
    "netCDF4>=1.7.4",
    "matplotlib>=3.11",
    "cartopy>=0.23",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "contourpy>=1.3",
    "typer>=0.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "imageio>=2.34",
    "pyarrow>=15.0",
    # Security floor: 12.3.0 fixes CVE-2026-25990 / 40192 / 42308-42311 and
    # PYSEC-2026-2253..2257 / 3451..3453. Do not lower.
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.3",
    "mypy>=2.3",
    "pre-commit>=3.6",
    # Stub versions track the pandas release they were tested against, so this
    # floor must move with the pandas floor above.
    "pandas-stubs>=3.0.5.260730",
    "pytest-xdist>=3.5",
    "types-PyYAML",
]
# `uv sync --extra video` only: moviepy caps pillow<12.0 against the CVE floor
# above, and what reconciles them is `[tool.uv] override-dependencies`, which is
# project-local and does not travel with the wheel or sdist. `pip install
# '.[video]'` therefore fails by design. Revisit when moviepy allows pillow 12.
video = [
    "moviepy>=2.2",
]
allsky = [
    "torch>=2.6.0",
    "imageio-ffmpeg>=0.6",
    "tensorboard>=2.14",
    "safetensors>=0.5",
]
tcc = [
    "torch>=2.6.0",
    "joblib>=1.3",
    "tensorboard>=2.14",
]
tcc-cuda = [
    "joblib>=1.3",
    "tensorboard>=2.14",
]

[project.urls]
Homepage = "https://labmim.if.ufba.br"
Repository = "https://github.com/Bruno-Mascarenhas/micrometeorology"
Issues = "https://github.com/Bruno-Mascarenhas/micrometeorology/issues"

[project.scripts]
labmim-wrf-figures = "micrometeorology.cli.render_wrf_maps:main"
labmim-wrf-geojson = "micrometeorology.cli.export_wrf_geojson:main"
labmim-sensor-process = "micrometeorology.cli.ingest_sensor_data:main"
labmim-archive = "micrometeorology.cli.build_archive:main"
labmim-climatology = "micrometeorology.cli.export_climatology:main"
labmim-sky = "micrometeorology.cli.export_sky:main"
labmim-monitoring = "micrometeorology.cli.export_monitoring:main"
labmim-wrf-series = "micrometeorology.cli.export_operational_series:main"
labmim-comparison = "micrometeorology.cli.compare_wrf_observations:main"
labmim-metrics = "micrometeorology.cli.compute_metrics:main"
labmim-station-graphs = "micrometeorology.cli.generate_station_graphs:main"
labmim-site-graphs = "micrometeorology.cli.plot_station_graphs:main"
allsky = "allsky.cli:main"
solrad-run = "solrad_correction.cli:main"
solrad-colab = "solrad_correction.cli_colab:main"

[tool.hatch.build.targets.wheel]
packages = ["src/micrometeorology", "src/solrad_correction", "src/allsky"]

# Without this the installed CLI resolves the QC limits, aggregation columns and
# calibration table to their empty defaults and exports unfiltered, uncalibrated
# data with exit code 0.
[tool.hatch.build.targets.wheel.force-include]
"configs/micromet" = "micrometeorology/configs/micromet"

# The sdist must keep the tree's own layout: `uv build` builds the wheel from the
# unpacked sdist, so the force-include above has to resolve at this same path.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs/micromet", "README.md", "LICENSE", "pyproject.toml"]

# Pin torch to the CPU wheel index so the resolver keeps the multi-GB CUDA stack
# out of uv.lock. For CUDA installs use `make install-cuda`.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.uv]
required-version = ">=0.12.5,<0.13"
build-constraint-dependencies = ["hatchling==1.31.0"]
# pillow overrides moviepy's cap so the lock can satisfy the CVE floor above;
# setuptools is transitive through the torch/tensorboard build chain and 81.x
# carries PYSEC-2026-3447.
override-dependencies = [
    "pillow>=12.3.0",
    "setuptools>=83.0.0",
]

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 100
# `extend-exclude`, not `exclude`, which would replace ruff's 25 built-ins that
# a bare `ruff check .` in `make check` relies on.
extend-exclude = [
    "legacy",
    "env",
]

[tool.ruff.lint]
# `extend-select`, not `select`: ruff 0.16 ships 413 default rules and these come
# on top of them.
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes — undefined names, unused imports
    "I",    # isort — import ordering
    "N",    # pep8-naming
    "UP",   # pyupgrade — modern syntax for the target version
    "B",    # flake8-bugbear — likely bugs and design traps
    "SIM",  # flake8-simplify
    "PERF", # perflint — performance anti-patterns
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
    "PT",   # flake8-pytest-style
    "PD",   # pandas-vet
    "NPY",  # numpy-specific — legacy RNG, deprecated aliases
    "S",    # flake8-bandit — security anti-patterns
    "A",    # flake8-builtins — names that shadow a builtin
    "DTZ",  # flake8-datetimez — naive datetimes
    "FURB", # refurb — outdated idioms with a modern replacement
    "G",    # flake8-logging-format — f-strings in log calls
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging — misuse of the logging API
    "TID",  # flake8-tidy-imports — relative and banned imports
    # Docstring presence on public classes and module-level functions, both at
    # zero today. Deliberately NOT D102: 29 public methods here are one-line
    # `@property` accessors whose only possible docstring restates their name,
    # which this repo's documentation standard forbids.
    "D101",
    "D103",
]
ignore = [
    # Enforced at format time by `line-length` above. What E501 reports here is
    # unsplittable string content the formatter cannot rewrap.
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Suppression policy: admissible only where the rule does not APPLY, never to
# waive a defect, and always at the narrowest scope that expresses it. An inline
# `# noqa: RULE - reason` is the normal form; an entry below is the broader claim
# that a rule does not apply to a whole file, and each one says why.
[tool.ruff.lint.per-file-ignores]
# Seeds the legacy GLOBAL stream on purpose — the one sklearn, torch's DataLoader
# and every bare `np.random.*` call draw from. `default_rng` has no such reach.
"src/solrad_correction/utils/seeds.py" = ["NPY002"]
# A test's NAME is its documentation here, so a required docstring would restate
# it. `assert` is pytest's assertion API. Benchmarks are `__main__` scripts.
"tests/**" = ["D101", "D103", "S101"]
"benchmarks/**" = ["D101", "D103"]
# Pickle is the thing under test: these assert a WorkUnit and a torch tensor
# survive the protocol the process pool actually uses.
"tests/allsky/test_embeddings_storage.py" = ["S301"]
"tests/micromet/test_wrf_jobs.py" = ["S301", "S603"]
# Spawn this package's own CLIs via `sys.executable`, which S603 cannot accept by
# construction: it is silent only when every argv element is a string literal.
"tests/allsky/test_cli.py" = ["S603"]
"tests/allsky/test_data_datasets.py" = ["S603"]
"tests/allsky/test_data_loading.py" = ["S603"]
"tests/allsky/test_modeling_contract.py" = ["S603"]
"tests/micromet/test_comparison.py" = ["S603"]
"tests/tcc/test_benchmarks_smoke.py" = ["S603"]
"tests/tcc/test_training_contracts.py" = ["S603"]
# A frozen copy of the pre-deletion writer, kept for bitwise diffing against the
# production ones; its docstring forbids editing the body.
"tests/micromet/_reference.py" = ["BLE001"]
"notebooks/*.ipynb" = ["S603", "S607"]
# A verification harness. S101: its `assert`s ARE its output, and a notebook
# never runs under `python -O`, so what the rule guards against cannot happen.
# S603/S607: it shells out to rclone, resolved from a variable rather than a
# string literal, which is the one shape S603 can never accept.
"notebooks/exploratory/03_verifica_bundle_no_drive.ipynb" = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["allsky", "micrometeorology", "solrad_correction"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
ignore_missing_imports = true
enable_error_code = ["ignore-without-code", "mutable-override"]
exclude = ["^legacy/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
# Nothing here is fatal, deliberately: the stack is bleeding-edge and bumped
# monthly, so an upcoming upstream removal must surface in the CI warnings
# summary during its deprecation window. A blanket "ignore::DeprecationWarning"
# is what hid them. Silence known third-party noise BY MESSAGE, later entries
# winning, so a reworded or new warning re-surfaces.
filterwarnings = [
    "default::DeprecationWarning",
    "default::UserWarning",
    # netCDF4 and joblib's numpy pickler both assign ndarray.shape; upstream fixes.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    # torch.as_tensor on read-only mmap arrays (safetensors / parquet buffers).
    "ignore:The given NumPy array is not writable:UserWarning",
    "ignore:Converting a tensor with requires_grad=True to a scalar:UserWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
