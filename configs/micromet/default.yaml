# Columns requiring special aggregation
sensor_sum_columns:
  - PL01_mm_Tot
  - Rain_WXT_Tot
  - Ramount_Tot
  - Hamount_Tot
  - Hamount_WXT_Tot
  - Precip
  - precip

sensor_wind_dir_columns:
  - WindDir_D1_WVT
  - Wd_MeanUnitVector
  - WD_WXT_Avg
  - WindDir
  - WindDir_GMX
  - WindDir1_GMX
  - WindDir2_GMX
  - WD

# Cada direção com a velocidade que pesa sua média vetorial. Sem o par, todo
# rumo entra com peso unitário e uma hora de calmaria vale tanto quanto uma
# rajada: medido contra o acervo real, 10,5% das horas da era v22 e 20,1% das
# horas da era WXT ficavam a mais de 5° do rumo ponderado, com máximo de 125°.
# `WD -> WS` é o par unificado, e é o que a aggregate_to_hourly enxerga depois
# de unify_sensor_columns — sem ele o rumo publicado continuaria não ponderado
# mesmo com todos os pares de era declarados.
sensor_wind_speed_column_map:
  WindDir_D1_WVT: WS_ms_S_WVT
  Wd_MeanUnitVector: Ws_Mean
  WD_WXT_Avg: WS_WXT_Avg
  WindDir: WS_ms
  WindDir_GMX: WS_ms_GMX
  WindDir1_GMX: WS1_ms_GMX
  WindDir2_GMX: WS2_ms_GMX
  WD: WS

# Minimum valid samples per aggregation window.
# Mantido em 6 de 12 (50%) por decisão do laboratório: é o valor com que o
# pipeline de sensores já roda e com que os números publicados foram medidos.
# A auditoria recomendava 9 (75%); subir exige recalcular a página inteira.
sensor_min_samples_per_hour: 6
sensor_sentinel_value: -900.0

# Logging
log_level: INFO
