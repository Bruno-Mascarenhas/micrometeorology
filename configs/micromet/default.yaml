# ==============================================================================
# LabMiM Micrometeorology — Default Configuration
# ==============================================================================
# This file ships with the repository and provides sensible defaults.
# Override per-environment via server.yaml / local.yaml or env vars.

# Paths (relative to project root; resolved at runtime)
data_dir: data
output_dir: output
figures_dir: output/figures
shapes_dir: shapes_BR_cities
# configs_dir is deliberately absent: this file lives in it, so redeclaring it
# here is what let the value drift. The Settings field default owns the path.

# No WRF configuration here: neither micrometeorology.wrf nor the three WRF CLIs
# import the configuration layer, so a variable list in this file would look
# authoritative and do nothing. Each CLI owns its own DEFAULT_VARS, and they are
# deliberately different from one another.

# Sensor quality-control limits
# Each bound is the WIDER of the physically impossible limit from the standards
# (WMO-No. 8; Zahumensky, WMO/TD-No. 1236) and the empirically absurd limit
# measured over the whole archive (988,289 five-minute samples, 2016-2026): the
# gates are here to remove instrument failures, not meteorological extremes.
# T [8, 40] removes 39 samples, all of them the Gill railing, and leaves the
# real measured range (10.21 to 36.95 C) intact.
#
# RAW column names only. apply_physical_limits() runs BEFORE
# unify_sensor_columns(), so a limit naming a canonical variable (T, ur,
# pressure, ...) would never fire.
sensor_limits:
  - { column: Temp1_Avg, lower: 8, upper: 40 }
  - { column: Temp_WXT_Avg, lower: 8, upper: 40 }
  - { column: AirTemp_Avg, lower: 8, upper: 40 }
  - { column: AirT_C_Avg, lower: 8, upper: 40 }
  - { column: AirT1_C_Avg, lower: 8, upper: 40 }
  - { column: AirT2_C_Avg, lower: 8, upper: 40 }
  - { column: RH, lower: 10, upper: 100 }
  - { column: RH1_Avg, lower: 10, upper: 100 }
  - { column: RH_WXT_Avg, lower: 10, upper: 100 }
  - { column: RelHumidity, lower: 10, upper: 100 }
  - { column: RH1, lower: 10, upper: 100 }
  - { column: RH2, lower: 10, upper: 100 }
  - { column: DP_C_Avg, lower: 5, upper: 32 }
  - { column: DP1_C_Avg, lower: 5, upper: 32 }
  - { column: DP2_C_Avg, lower: 5, upper: 32 }
  - { column: AirPressure, lower: 985, upper: 1030 }
  - { column: Pmb_WXT_Avg, lower: 985, upper: 1030 }
  - { column: Pmb_WXT, lower: 985, upper: 1030 }
  - { column: BP_mbar_Avg, lower: 985, upper: 1030 }
  - { column: BP1_mbar_Avg, lower: 985, upper: 1030 }
  - { column: BP2_mbar_Avg, lower: 985, upper: 1030 }
  - { column: WS_ms_S_WVT, lower: 0, upper: 25 }
  - { column: Ws_Mean, lower: 0, upper: 25 }
  - { column: WS_WXT_Avg, lower: 0, upper: 25 }
  - { column: WS_ms, lower: 0, upper: 25 }
  - { column: WS1_ms_Avg, lower: 0, upper: 25 }
  - { column: WS_ms_GMX, lower: 0, upper: 25 }
  - { column: WS1_ms_GMX, lower: 0, upper: 25 }
  - { column: WS2_ms_GMX, lower: 0, upper: 25 }
  - { column: WindDir_D1_WVT, lower: 0, upper: 360 }
  - { column: Wd_MeanUnitVector, lower: 0, upper: 360 }
  - { column: WD_WXT_Avg, lower: 0, upper: 360 }
  - { column: WindDir, lower: 0, upper: 360 }
  - { column: WindDir_GMX, lower: 0, upper: 360 }
  - { column: WindDir1_GMX, lower: 0, upper: 360 }
  - { column: WindDir2_GMX, lower: 0, upper: 360 }
  - { column: WindDir_SD1_WVT, lower: 0, upper: 180 }
  - { column: Wd_StdDev, lower: 0, upper: 180 }
  - { column: WindDir_SD, lower: 0, upper: 180 }
  - { column: PSP1_Wm2_Avg, lower: -20, upper: 1500 }
  - { column: CM3Up_Wm2_Avg, lower: -20, upper: 1500 }
  - { column: CM3Dn_Wm2_Avg, lower: -40, upper: 650 }
  - { column: CMP21_Wm2_Avg, lower: -20, upper: 1200 }
  - { column: PSP_Wm2_Avg, lower: -20, upper: 1200 }
  - { column: CMP22_Wm2_Avg, lower: -20, upper: 1200 }
  - { column: PIR1_Wm2_Avg, lower: 250, upper: 550 }
  - { column: CG3Up_Wm2Cr_Avg, lower: 250, upper: 550 }
  - { column: CG3Up_Wm2_cor_Avg, lower: 250, upper: 550 }
  - { column: CG3Up_Wm2_Corr_Avg, lower: 250, upper: 550 }
  - { column: CG3Dn_Wm2Cr_Avg, lower: 300, upper: 650 }
  - { column: CG3Dn_Wm2_cor_Avg, lower: 300, upper: 650 }
  - { column: CG3Dn_Wm2_Corr_Avg, lower: 300, upper: 650 }
  - { column: CG3Up_Wm2_Avg, lower: -250, upper: 250 }
  - { column: CG3Dn_Wm2_Avg, lower: -250, upper: 250 }
  - { column: Net_Wm2_Avg, lower: -300, upper: 1400 }
  - { column: NRLite_Wm2_Avg, lower: -300, upper: 1300 }
  - { column: NRLite_Wm2Cr_Avg, lower: -300, upper: 1300 }
  - { column: NRLite_Wm2_Corr_Avg, lower: -300, upper: 1300 }
  - { column: NRLite_Wm2Corr_Avg, lower: -300, upper: 1300 }
  - { column: PAR_Wm2_Avg, lower: -5, upper: 800 }
  - { column: PAR_Den_Avg, lower: -0.2, upper: 23 }
  - { column: CUV5_Wm2_Avg, lower: -2, upper: 110 }
  - { column: CNR1TC_Avg, lower: 15, upper: 57 }
  - { column: CNR1TK_Avg, lower: 288, upper: 330 }
  - { column: T_C1_Avg, lower: 288, upper: 330 }
  - { column: T_D1_Avg, lower: 288, upper: 330 }
  - { column: PL01_mm_Tot, lower: 0, upper: 25.4 }
  - { column: Rain_WXT_Tot, lower: 0, upper: 25.4 }
  - { column: Ramount_Tot, lower: 0, upper: 25.4 }
  - { column: Hamount_Tot, lower: 0, upper: 25.4 }
  - { column: Hamount_WXT_Tot, lower: 0, upper: 25.4 }

# Excursion (spike/dip) test: a value that leaves the series and returns within
# `max_len` samples, coming back inside `return_tol` of where it left. The RETURN
# is the discriminator, not the size of the jump — a convective cold pool is a
# large step but does not recover in five minutes. Measured over the whole
# archive: a plain step test at 1.5 C flags 305 temperature samples, 50.2% of
# them rain-coincident against a 6.12% baseline; the excursion form flags 32, at
# 15.6%. Differences are taken only where the index advances exactly 5 minutes.
sensor_step_limits:
  # 626 samples, 533 hours shifted by up to 4.26 hPa, none of it weather: the
  # flagged set is 4.1% rain-coincident against the 6.12% baseline, and 97.4% of
  # it sits INSIDE the [985, 1030] range gate above. The threshold is read off a
  # gap, not chosen: genuine 5-min variability has p99 = 0.20 hPa and the
  # smallest artifact step measured is 11.21 hPa. 1.0 also clears the coarsest
  # barometer's 1 hPa quantisation. Pmb_WXT, Pmb_WXT_Avg and AirPressure are
  # deliberately absent — their dropouts already fall outside the range gate.
  - { column: BP1_mbar_Avg, threshold: 1.0, return_tol: 1.0, max_len: 2 }
  - { column: BP2_mbar_Avg, threshold: 1.0, return_tol: 1.0, max_len: 2 }
  - { column: BP_mbar_Avg, threshold: 1.0, return_tol: 1.0, max_len: 2 }
  # 205 samples. 3.0 C is the WMO one-minute air-temperature step limit
  # (Zahumensky 2004, WMO/TD-No. 1236, ch. II sec. II.b), which is conservative
  # applied to a 5-minute mean. Do NOT lower to 1.5 on Temp1_Avg: the samples it
  # would add there are 30% rain-coincident. It is measured safe on the others.
  - { column: Temp1_Avg, threshold: 3.0, return_tol: 1.5, max_len: 2 }
  - { column: Temp_WXT_Avg, threshold: 3.0, return_tol: 1.5, max_len: 2 }
  - { column: AirTemp_Avg, threshold: 3.0, return_tol: 1.5, max_len: 2 }
  - { column: AirT_C_Avg, threshold: 3.0, return_tol: 1.5, max_len: 2 }
  - { column: AirT1_C_Avg, threshold: 3.0, return_tol: 1.5, max_len: 2 }
  - { column: AirT2_C_Avg, threshold: 3.0, return_tol: 1.5, max_len: 2 }
  # 16 samples. 15 %RH sits between the two published same-family anchors — the
  # Oklahoma Mesonet's 20% per 5 min (Shafer et al. 2000, JTECH 17:474-494,
  # tab. 3) and WMO's 10% per 1 min — and is fifteen quantiser counts on the
  # integer-recorded channels, so it cannot degenerate into flagging digitisation.
  - { column: RH1_Avg, threshold: 15.0, return_tol: 7.5, max_len: 2 }
  - { column: RH_WXT_Avg, threshold: 15.0, return_tol: 7.5, max_len: 2 }
  - { column: RelHumidity, threshold: 15.0, return_tol: 7.5, max_len: 2 }
  - { column: RH, threshold: 15.0, return_tol: 7.5, max_len: 2 }
  - { column: RH1, threshold: 15.0, return_tol: 7.5, max_len: 2 }
  - { column: RH2, threshold: 15.0, return_tol: 7.5, max_len: 2 }

# Persistence test: runs of more than `min_run` bitwise-identical samples, which
# is how a railed sensor looks to a gate that only checks bounds. A data gap
# breaks a run. `exempt_at_or_below` skips a level at which a repeated value is
# the instrument reading calm; for a direction column it is evaluated on the
# PAIRED SPEED from sensor_wind_speed_column_map.
# That exemption is bounded in DURATION too, by `exempt_max_run`, defaulting to
# the channel's own `min_run`. Unbounded it protects a sensor that died reporting
# zero for as long as it stays dead. The two populations are three orders of
# magnitude apart here: genuine calm runs reach 2 samples at p99 and 6 at their
# longest, while the rails run 1,318 to 3,060 samples — 110 to 255 hours of a
# coastal site reporting no wind at all.
# The windows are LOCALLY DERIVED from the longest genuine run per family, not
# taken from WMO/TD-No. 1236: its minimum-variability-over-60-minutes form flags
# 3.6% of Temp1_Avg and 10.1% of RH1_Avg at this site. A damped maritime tropical
# climate genuinely holds still longer than the stations that criterion was
# written for.
sensor_persistence_limits:
  # 0 samples today: a regression guard. The longest genuine run in ten years is
  # 33 samples, so 36 clears the observed maximum and still fires the moment a
  # thermometer rails at an in-range value.
  - { column: Temp1_Avg, min_run: 36 }
  - { column: Temp_WXT_Avg, min_run: 36 }
  - { column: AirTemp_Avg, min_run: 36 }
  - { column: AirT_C_Avg, min_run: 36 }
  - { column: AirT1_C_Avg, min_run: 36 }
  - { column: AirT2_C_Avg, min_run: 36 }
  # 0 samples today, longest genuine run 14. High-resolution barometers ONLY:
  # Pmb_WXT and Pmb_WXT_Avg are quantised to 0.1 and 1 hPa, where identical
  # consecutive readings are the quantiser rather than a fault.
  - { column: BP1_mbar_Avg, min_run: 36 }
  - { column: BP2_mbar_Avg, min_run: 36 }
  - { column: BP_mbar_Avg, min_run: 36 }
  - { column: AirPressure, min_run: 36 }
  # 33,971 samples, and the largest published change in this file: it removes an
  # anemometer that sat at two distinct values for 18 consecutive days while the
  # paired vane swept 6,984 distinct bearings. NEVER raise the exemption to the
  # propeller's own 0.281 m/s stall floor — measured, that collapses the catch to
  # 816 and the dead anemometer disappears entirely.
  - { column: WS_ms_S_WVT, min_run: 36, exempt_at_or_below: 0.1 }
  - { column: WS_WXT_Avg, min_run: 36, exempt_at_or_below: 0.1 }
  - { column: WS_ms, min_run: 36, exempt_at_or_below: 0.1 }
  - { column: WS1_ms_GMX, min_run: 36, exempt_at_or_below: 0.1 }
  - { column: WS2_ms_GMX, min_run: 36, exempt_at_or_below: 0.1 }
  # 9,995 samples. The exemption on the paired speed is what makes this honest:
  # the logger writes direction 0 whenever speed is 0, and without it 4,765
  # WD_WXT_Avg calm-fill zeros would be masked as a jammed vane. What survives is
  # real — WindDir_D1_WVT frozen at 71.6 deg for 3,551 samples while its
  # anemometer averaged 1.3 m/s.
  - { column: WindDir_D1_WVT, min_run: 36, exempt_at_or_below: 0.1 }
  - { column: WD_WXT_Avg, min_run: 36, exempt_at_or_below: 0.1 }
  - { column: WindDir1_GMX, min_run: 36, exempt_at_or_below: 0.1 }
  - { column: WindDir2_GMX, min_run: 36, exempt_at_or_below: 0.1 }
  # 2,265 samples: 146 h frozen at 72.47 %RH from 2018-08-21 and 42.7 h at
  # 48.3 %RH from 2023-03-08, both of which survive the range gate today. The
  # window is four times temperature's because RH, RH1 and RH2 are
  # integer-recorded and hold genuine 61-sample runs from digitisation alone; at
  # 144 those three fall to exactly zero while both real rails are still caught.
  - { column: RH1_Avg, min_run: 144 }
  - { column: RH_WXT_Avg, min_run: 144 }
  - { column: RelHumidity, min_run: 144 }
  - { column: RH, min_run: 144 }
  - { column: RH1, min_run: 144 }
  - { column: RH2, min_run: 144 }

# Columns requiring special aggregation
sensor_sum_columns:
  - PL01_mm_Tot
  - Rain_WXT_Tot
  - Ramount_Tot
  - Hamount_Tot
  - Hamount_WXT_Tot
  - Precip
  - precip

sensor_wind_dir_columns:
  - WindDir_D1_WVT
  - Wd_MeanUnitVector
  - WD_WXT_Avg
  - WindDir
  - WindDir_GMX
  - WindDir1_GMX
  - WindDir2_GMX
  - WD

# Each direction paired with the speed that weights its vector mean. Unpaired,
# every bearing enters with unit weight and a calm hour counts as much as a
# gust: measured over the archive, 10.5% of the v22-era hours and 20.1% of the
# WXT-era hours then sat more than 5 deg off the weighted bearing, up to 125 deg.
# `WD -> WS` is the unified pair, and the one aggregate_to_hourly sees after
# unify_sensor_columns.
sensor_wind_speed_column_map:
  WindDir_D1_WVT: WS_ms_S_WVT
  Wd_MeanUnitVector: Ws_Mean
  WD_WXT_Avg: WS_WXT_Avg
  WindDir: WS_ms
  WindDir_GMX: WS_ms_GMX
  WindDir1_GMX: WS1_ms_GMX
  WindDir2_GMX: WS2_ms_GMX
  WD: WS

# Minimum valid samples per aggregation window.
# Held at 6 of 12 (50%) by laboratory decision: it is what the sensor pipeline
# runs with and what the published numbers were measured under. The audit
# recommended 9 (75%); raising it means recomputing the whole page.
sensor_min_samples_per_hour: 6
sensor_sentinel_value: -900.0

# Logging
log_level: INFO
