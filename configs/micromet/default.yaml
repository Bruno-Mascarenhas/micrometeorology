# ==============================================================================
# LabMiM Micrometeorology — Default Configuration
# ==============================================================================
# This file ships with the repository and provides sensible defaults.
# Override per-environment via server.yaml / local.yaml or env vars.

# Paths (relative to project root; resolved at runtime)
data_dir: data
output_dir: output
figures_dir: output/figures
shapes_dir: shapes_BR_cities
# configs_dir is deliberately absent: this file lives in it, so redeclaring it
# here is what let the value drift. The Settings field default owns the path.

# Nenhuma configuração de WRF aqui: nem micrometeorology.wrf nem as três CLIs de
# WRF importam a camada de configuração, então uma lista de variáveis neste
# arquivo parecia autoritativa e não tinha efeito nenhum. Cada CLI carrega a sua
# própria DEFAULT_VARS, e elas são deliberadamente diferentes entre si.

# Sensor quality-control limits
# Revisados em 2026-08-09 contra a distribuicao empirica de todo o acervo
# (988.289 amostras de 5 min, 2016-2026), cruzando o limite fisicamente
# impossivel dos padroes (WMO-No. 8; Zahumensky, WMO/TD-No. 1236) com o
# limite empiricamente absurdo medido aqui. Onde os dois discordam vale o
# MAIS LARGO: a instrucao era endurecer o controle sem perder dado real.
#
# Cada limite abaixo foi verificado amostra a amostra. O que eles removem sao
# falhas de instrumento (trilhos do Gill, quedas de comunicacao isoladas com
# vizinhos normais, picos que co-ocorrem com outro canal falhando), nao
# extremos meteorologicos. Ex.: T [8,40] remove 39 amostras, todas trilho do
# Gill; a faixa real medida (10,21 a 36,95 C) fica intacta.
#
# So nomes de coluna CRUS aparecem aqui. apply_physical_limits() roda ANTES de
# unify_sensor_columns() no build_archive, entao um limite com nome canonico
# (T, ur, pressure...) nunca dispararia — foi exatamente assim que a versao
# anterior chegou a 19 de 21 entradas mortas.
sensor_limits:
  - { column: Temp1_Avg, lower: 8, upper: 40 }
  - { column: Temp_WXT_Avg, lower: 8, upper: 40 }
  - { column: AirTemp_Avg, lower: 8, upper: 40 }
  - { column: AirT_C_Avg, lower: 8, upper: 40 }
  - { column: AirT1_C_Avg, lower: 8, upper: 40 }
