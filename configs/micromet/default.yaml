# ==============================================================================
# LabMiM Micrometeorology — Default Configuration
# ==============================================================================
# This file ships with the repository and provides sensible defaults.
# Override per-environment via server.yaml / local.yaml or env vars.

# Paths (relative to project root; resolved at runtime)
data_dir: data
output_dir: output
figures_dir: output/figures
shapes_dir: shapes_BR_cities
# configs_dir is deliberately absent: this file lives in it, so redeclaring it
# here is what let the value drift. The Settings field default owns the path.

# No WRF configuration here: neither micrometeorology.wrf nor the three WRF CLIs
# import the configuration layer, so a variable list in this file would look
# authoritative and do nothing. Each CLI owns its own DEFAULT_VARS, and they are
# deliberately different from one another.

# Sensor quality-control limits
# Each bound is the WIDER of the physically impossible limit from the standards
# (WMO-No. 8; Zahumensky, WMO/TD-No. 1236) and the empirically absurd limit
# measured over the whole archive (988,289 five-minute samples, 2016-2026): the
# gates are here to remove instrument failures, not meteorological extremes.
# T [8, 40] removes 39 samples, all of them the Gill railing, and leaves the
# real measured range (10.21 to 36.95 C) intact.
#
# RAW column names only. apply_physical_limits() runs BEFORE
# unify_sensor_columns(), so a limit naming a canonical variable (T, ur,
# pressure, ...) would never fire.
sensor_limits:
  - { column: Temp1_Avg, lower: 8, upper: 40 }
  - { column: Temp_WXT_Avg, lower: 8, upper: 40 }
  - { column: AirTemp_Avg, lower: 8, upper: 40 }
  - { column: AirT_C_Avg, lower: 8, upper: 40 }
  - { column: AirT1_C_Avg, lower: 8, upper: 40 }
  - { column: AirT2_C_Avg, lower: 8, upper: 40 }
  - { column: RH, lower: 10, upper: 100 }
  - { column: RH1_Avg, lower: 10, upper: 100 }
  - { column: RH_WXT_Avg, lower: 10, upper: 100 }
  - { column: RelHumidity, lower: 10, upper: 100 }
  - { column: RH1, lower: 10, upper: 100 }
  - { column: RH2, lower: 10, upper: 100 }
  - { column: DP_C_Avg, lower: 5, upper: 32 }
  - { column: DP1_C_Avg, lower: 5, upper: 32 }
  - { column: DP2_C_Avg, lower: 5, upper: 32 }
  - { column: AirPressure, lower: 985, upper: 1030 }
  - { column: Pmb_WXT_Avg, lower: 985, upper: 1030 }
  - { column: Pmb_WXT, lower: 985, upper: 1030 }
  - { column: BP_mbar_Avg, lower: 985, upper: 1030 }
  - { column: BP1_mbar_Avg, lower: 985, upper: 1030 }
  - { column: BP2_mbar_Avg, lower: 985, upper: 1030 }
  - { column: WS_ms_S_WVT, lower: 0, upper: 25 }
  - { column: Ws_Mean, lower: 0, upper: 25 }
  - { column: WS_WXT_Avg, lower: 0, upper: 25 }
  - { column: WS_ms, lower: 0, upper: 25 }
  - { column: WS1_ms_Avg, lower: 0, upper: 25 }
  - { column: WS_ms_GMX, lower: 0, upper: 25 }
  - { column: WS1_ms_GMX, lower: 0, upper: 25 }
  - { column: WS2_ms_GMX, lower: 0, upper: 25 }
  - { column: WindDir_D1_WVT, lower: 0, upper: 360 }
  - { column: Wd_MeanUnitVector, lower: 0, upper: 360 }
  - { column: WD_WXT_Avg, lower: 0, upper: 360 }
  - { column: WindDir, lower: 0, upper: 360 }
  - { column: WindDir_GMX, lower: 0, upper: 360 }
  - { column: WindDir1_GMX, lower: 0, upper: 360 }
  - { column: WindDir2_GMX, lower: 0, upper: 360 }
  - { column: WindDir_SD1_WVT, lower: 0, upper: 180 }
  - { column: Wd_StdDev, lower: 0, upper: 180 }
  - { column: WindDir_SD, lower: 0, upper: 180 }
  - { column: PSP1_Wm2_Avg, lower: -20, upper: 1500 }
  - { column: CM3Up_Wm2_Avg, lower: -20, upper: 1500 }
  - { column: CM3Dn_Wm2_Avg, lower: -40, upper: 650 }
  - { column: CMP21_Wm2_Avg, lower: -20, upper: 1200 }
  - { column: PSP_Wm2_Avg, lower: -20, upper: 1200 }
  - { column: CMP22_Wm2_Avg, lower: -20, upper: 1200 }
  - { column: PIR1_Wm2_Avg, lower: 250, upper: 550 }
  - { column: CG3Up_Wm2Cr_Avg, lower: 250, upper: 550 }
  - { column: CG3Up_Wm2_cor_Avg, lower: 250, upper: 550 }
  - { column: CG3Up_Wm2_Corr_Avg, lower: 250, upper: 550 }
  - { column: CG3Dn_Wm2Cr_Avg, lower: 300, upper: 650 }
  - { column: CG3Dn_Wm2_cor_Avg, lower: 300, upper: 650 }
  - { column: CG3Dn_Wm2_Corr_Avg, lower: 300, upper: 650 }
  - { column: CG3Up_Wm2_Avg, lower: -250, upper: 250 }
  - { column: CG3Dn_Wm2_Avg, lower: -250, upper: 250 }
  - { column: Net_Wm2_Avg, lower: -300, upper: 1400 }
  - { column: NRLite_Wm2_Avg, lower: -300, upper: 1300 }
  - { column: NRLite_Wm2Cr_Avg, lower: -300, upper: 1300 }
  - { column: NRLite_Wm2_Corr_Avg, lower: -300, upper: 1300 }
  - { column: NRLite_Wm2Corr_Avg, lower: -300, upper: 1300 }
  - { column: PAR_Wm2_Avg, lower: -5, upper: 800 }
  - { column: PAR_Den_Avg, lower: -0.2, upper: 23 }
  - { column: CUV5_Wm2_Avg, lower: -2, upper: 110 }
  - { column: CNR1TC_Avg, lower: 15, upper: 57 }
  - { column: CNR1TK_Avg, lower: 288, upper: 330 }
  - { column: T_C1_Avg, lower: 288, upper: 330 }
  - { column: T_D1_Avg, lower: 288, upper: 330 }
  - { column: PL01_mm_Tot, lower: 0, upper: 25.4 }
  - { column: Rain_WXT_Tot, lower: 0, upper: 25.4 }
  - { column: Ramount_Tot, lower: 0, upper: 25.4 }
  - { column: Hamount_Tot, lower: 0, upper: 25.4 }
  - { column: Hamount_WXT_Tot, lower: 0, upper: 25.4 }
# Columns requiring special aggregation
sensor_sum_columns:
  - PL01_mm_Tot
  - Rain_WXT_Tot
  - Ramount_Tot
  - Hamount_Tot
  - Hamount_WXT_Tot
  - Precip
  - precip

sensor_wind_dir_columns:
  - WindDir_D1_WVT
  - Wd_MeanUnitVector
  - WD_WXT_Avg
  - WindDir
  - WindDir_GMX
  - WindDir1_GMX
  - WindDir2_GMX
  - WD

# Each direction paired with the speed that weights its vector mean. Unpaired,
# every bearing enters with unit weight and a calm hour counts as much as a
# gust: measured over the archive, 10.5% of the v22-era hours and 20.1% of the
# WXT-era hours then sat more than 5 deg off the weighted bearing, up to 125 deg.
# `WD -> WS` is the unified pair, and the one aggregate_to_hourly sees after
# unify_sensor_columns.
sensor_wind_speed_column_map:
  WindDir_D1_WVT: WS_ms_S_WVT
  Wd_MeanUnitVector: Ws_Mean
  WD_WXT_Avg: WS_WXT_Avg
  WindDir: WS_ms
  WindDir_GMX: WS_ms_GMX
  WindDir1_GMX: WS1_ms_GMX
  WindDir2_GMX: WS2_ms_GMX
  WD: WS

# Minimum valid samples per aggregation window.
# Held at 6 of 12 (50%) by laboratory decision: it is what the sensor pipeline
# runs with and what the published numbers were measured under. The audit
# recommended 9 (75%); raising it means recomputing the whole page.
sensor_min_samples_per_hour: 6
sensor_sentinel_value: -900.0

# Logging
log_level: INFO
