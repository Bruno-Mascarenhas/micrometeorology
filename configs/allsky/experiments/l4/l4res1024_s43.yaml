# Segunda semente do braco de 1024 px na L4. Identico ao l4res1024_s42 em tudo
# menos a semente; o cabecalho daquele arquivo justifica a receita. A 512 px a
# difusa espalha 1,4 W/m2 entre sementes, entao um unico run a 1024 dentro dessa
# faixa nao distingue ganho de sorte.
extends: [../_base.yaml, ../../models/image_only.yaml]
name: l4res1024_s43
output_dir: output/allsky-mm/experiments/l4/l4res1024_s43
seed: 43
features:
  set: bare
data:
  data_root: output/allsky-mm/dataset-iso-1024-20260910
  input_mode: image
targets:
  dhi:
    enabled: true
    loss: mae
    weight: 1.0
    parameterization: clearsky_index
  kindex:
    enabled: true
    kind: kstar
    loss: mae
    weight: 1.0
  sky:
    enabled: true
    weight: 0.25
model:
  backbone: dinov3_vits16plus
  image_size: 1024
  backbone_frozen: false
  unfreeze_last_n: 12
  backbone_pooling: cls+mean
train:
  layer_decay: 0.8
  lr: 0.0003
  backbone_lr: 0.00001
  batch_size: 10
  grad_accum_steps: 2
  epochs: 48
  weight_decay: 0.05
  num_workers: 8
  amp:
    enabled: true
    dtype: bf16
  cmixup:
    enabled: true
    alpha: 1.0
    bandwidth: 0.05
    p: 0.5
  early_stopping:
    patience: 12
    min_delta: 0.0002
    monitor: val/kindex_mae
augmentation:
  p_exposure: 0.5
  exposure_log2: 0.6
  p_noise: 0.3
  noise_sigma: 0.01
  p_erase: 0.25
