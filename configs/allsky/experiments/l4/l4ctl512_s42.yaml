# Controle pareado do braco de 1024 px: a MESMA receita do l4res1024_s42 (lote
# 10 com acumulacao 2, bf16, cosseno de 48, paciencia 12, num_workers 8), os
# MESMOS JPEGs de 1024 px (data_root dataset-iso-1024-20260910) e so image_size
# 512. O nome nao repete "res512" porque l4v3res512 e outra receita (lote 32,
# cosseno de 150). O loader reduz o quadro de 1024 para 512 em tempo de execucao
# com o mesmo BILINEAR do PIL da extracao. NAO e byte-identico ao dataset de 512
# (medido em 2026-09-10): a reducao em dois passos 1711 -> 1024 -> 512 tem kernel
# diferente da direta (15% dos pixels, |d| <= 18 num quadro cru) e o JPEG q92 do
# quadro de 1024 acrescenta ruido de quantizacao proprio (contra o 512 gravado,
# ~40% dos pixels, |d| <= ~60, medio ~0,7). O que ele compartilha byte a byte e a
# ORIGEM do braco de 1024, os mesmos JPEGs, e por isso e o par limpo do
# l4res1024_s42, nao do ceuv3res512. Na familia de 512 receita e semente estao
# confundidas (s42 cosseno 40 / s43 cosseno 50 na 2060 fp16 lote 16; s44/s45
# lote 32 bf16 cosseno 150 na L4) e a difusa espalha 1,4 W/m2 na direcao da
# mudanca de receita, entao ela NAO isola o efeito dos knobs. Uma corrida contra
# outra cabe dentro desses 1,4 W/m2; o papel deste controle e outro: se cair
# dentro da faixa da familia de 512 (DHI 18,1-19,5, F1 por bloco 0,692-0,695),
# a receita e inerte a 512 e as sementes de 1024 passam a ser comparaveis a
# familia inteira. Custa uma sessao da L4 (a 512 px a imagem custa ~7x menos
# que a 1024: ~12 min/epoca, ~10 h para 48 epocas).
extends: [../_base.yaml, ../../models/image_only.yaml]
name: l4ctl512_s42
output_dir: output/allsky-mm/experiments/l4/l4ctl512_s42
seed: 42
features:
  set: bare
data:
  data_root: output/allsky-mm/dataset-iso-1024-20260910
  input_mode: image
targets:
  dhi:
    enabled: true
    loss: mae
    weight: 1.0
    parameterization: clearsky_index
  kindex:
    enabled: true
    kind: kstar
    loss: mae
    weight: 1.0
  sky:
    enabled: true
    weight: 0.25
model:
  backbone: dinov3_vits16plus
  image_size: 512
  backbone_frozen: false
  unfreeze_last_n: 12
  backbone_pooling: cls+mean
train:
  layer_decay: 0.8
  lr: 0.0003
  backbone_lr: 0.00001
  batch_size: 10
  grad_accum_steps: 2
  epochs: 48
  weight_decay: 0.05
  num_workers: 8
  amp:
    enabled: true
    dtype: bf16
  cmixup:
    enabled: true
    alpha: 1.0
    bandwidth: 0.05
    p: 0.5
  early_stopping:
    patience: 12
    min_delta: 0.0002
    monitor: val/kindex_mae
augmentation:
  p_exposure: 0.5
  exposure_log2: 0.6
  p_noise: 0.3
  noise_sigma: 0.01
  p_erase: 0.25
