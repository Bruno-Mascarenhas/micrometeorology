# a100res1024: a resolucao maxima que cabe em 24 h de A100, e o degrau que as
# evidencias apontam.
#
# Por que resolucao, e por que por quadro. A resolucao foi a unica alavanca que
# melhorou as DUAS tarefas: de 256 para 512 px a difusa caiu de 20,5 para 18,0
# W/m2 e o F1 por bloco subiu de 0,658 para 0,695. Backbone maior (ViT-B/16) e
# features tabulares (exposicao, log-radiancia) foram inertes, e a unidade de
# bloco PERDEU do quadro a quadro no mesmo teste (2026-09-09: bloco 17,9 / 0,660
# contra quadro 14,5 / 0,695), porque media de predicoes reduz variancia e media
# de codificacoes nao. Entao: um quadro por amostra, 1024 px, e a agregacao por
# bloco fica para a avaliacao.
#
# O dado permite. A reextracao isotropica produz um disco de 1711 px
# (allsky.lens.ISOTROPIC_FRAME_PX), entao 1024 ainda e reducao do original: ha
# detalhe real entrando, nao interpolacao. Exige a raiz
# dataset-iso-1024-20260910, reextraida em 2026-09-10.
#
# Memoria, e por que batch 20. Medido 0,355 GB por imagem a 512 px (14,2 GB em 40
# imagens na L4). A 1024 px as fichas vao de 1.024 para 4.096 e a memoria de
# ativacao acompanha linearmente, porque a atencao usa o nucleo economico do
# PyTorch: ~1,42 GB por imagem. A extrapolacao e derivada, nao medida a 1024 px, e
# erra facil 25% para cima por workspace e fragmentacao. Nos 40 GB da A100:
#   batch 16 -> 23 GB, e 29 GB no pior caso
#   batch 20 -> 29 GB, e 36 GB no pior caso   <- escolhido
#   batch 24 -> 35 GB, e 43 GB no pior caso: estoura no topo da faixa
# Batch 20 usa de 72% a 90% da placa conforme a extrapolacao acerte ou erre, e e o
# maior que nao perde a sessao por falta de memoria. Numa A100 de 80 GB da para
# dobrar: ponha a100res1024_s42.yaml com batch_size 48 em fila-l4/ no Drive.
# O lr NAO foi reescalado com o batch, pelo mesmo motivo do ceuv3res512: a ida de
# 8 para 16 a 512 px tambem nao foi, e foi ela que produziu o melhor braco. Mudar
# resolucao e passo de otimizacao juntos impediria atribuir o efeito. O batch maior
# ainda da mais candidatos ao C-Mixup por lote.
#
# Tempo. A 1024 px o custo por imagem nao e 4x o de 512, e ~7,7x: com d=384 e 12
# camadas, 12*N*d^2 + 2*N^2*d passa de 2,6 para 20,1 GFLOP-MAC por imagem, porque
# a atencao deixa de ser termo menor (N/4d vai de 0,67 para 2,67). Partindo dos
# 12,5 min/epoca medidos na L4 a 512 px com batch 32, e tomando a A100 como 2,5x
# a L4, da ~38 min/epoca. O batch nao muda essa conta: a epoca custa o numero de
# imagens, nao o de passos. Uma sessao de 24 h cabe ~30 epocas mais as tres
# avaliacoes (~5 h), entao 48 epocas sao duas sessoes; se a paciencia parar na
# casa dos 40, uma sessao e meia. A incerteza do tempo por epoca e de um fator 1,3.
#
# 48 epocas de cosseno com paciencia 12 (decidido em 2026-09-09 22:30, depois de
# medir o que a paciencia compra). Duas razoes, ambas medidas:
#   1. O HORIZONTE, nao a paciencia, e o que decide se o last serve. Num cosseno de
#      150 a taxa da cabeca ainda esta em 83% do pico na epoca 40 e 75% na 50: o
#      last e um peso de meio de treino. Foi o que o l4bloco512_s42 mostrou (last
#      0,624 contra best 0,660 de F1 por bloco). Com 48, a taxa cai a 7% do pico na
#      epoca 40 e a zero na 48, e best e last voltam a concordar como no
#      ceuv3res512_s42 (cosseno de 40 fechado).
#   2. A PACIENCIA de 12 e generosa pela evidencia. Em quatro runs a ultima melhora
#      acima de min_delta 0,0002 nunca veio depois da epoca 29 (s42 na 9, s43 na
#      10, bloco na 29, s44 na 10), e depois dela o melhor valor foi sempre 0,0008
#      a 0,0012 PIOR. Cada epoca de paciencia custa ~38 min de A100; 20 gastaria
#      12,7 h contra 7,6 h de 12, sem nada observado em troca.
# 48 epocas a ~38 min sao ~30 h, acima das 24 h de uma sessao do Colab Pro+. O
# braco e feito para atravessar sessoes: sync_live espelha last.ckpt e best.ckpt
# para o Drive a cada epoca, pull_live_run os restaura, `allsky train --resume
# auto` continua da epoca seguinte e _reconcile_cosine_horizon repõe o T_max do
# cosseno. Rodar o notebook de novo e o unico passo manual. Se a paciencia parar
# antes, o engine reconhece (epochs_no_improve >= patience) e vai direto as
# avaliacoes.
extends: [../_base.yaml, ../../models/image_only.yaml]
name: a100res1024_s42
output_dir: output/allsky-mm/experiments/l4/a100res1024_s42
seed: 42
features:
  set: bare
data:
  data_root: output/allsky-mm/dataset-iso-1024-20260910
  input_mode: image
targets:
  dhi:
    enabled: true
    loss: mae
    weight: 1.0
    parameterization: clearsky_index
  kindex:
    enabled: true
    kind: kstar
    loss: mae
    weight: 1.0
  sky:
    enabled: true
    weight: 0.25
model:
  backbone: dinov3_vits16plus
  image_size: 1024
  backbone_frozen: false
  unfreeze_last_n: 12
  backbone_pooling: cls+mean
train:
  layer_decay: 0.8
  lr: 0.0003
  backbone_lr: 0.00001
  batch_size: 20
  epochs: 48
  weight_decay: 0.05
  num_workers: 12
  amp:
    enabled: true
    dtype: bf16
  cmixup:
    enabled: true
    alpha: 1.0
    bandwidth: 0.05
    p: 0.5
  early_stopping:
    patience: 12
    min_delta: 0.0002
    monitor: val/kindex_mae
augmentation:
  p_exposure: 0.5
  exposure_log2: 0.6
  p_noise: 0.3
  noise_sigma: 0.01
  p_erase: 0.25
