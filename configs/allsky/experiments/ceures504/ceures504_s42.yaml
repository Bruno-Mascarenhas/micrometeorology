# ceures504: a hipotese que sobrou com suporte — informacao. O fotometro e inerte
# (controle embaralhado empata), backbone e media de pesos nao movem, e o unico
# braco que mexeu na classe parcialmente-clara foi o v3 a 256 px. Os frames em
# disco tem 512 px; a 224 a rede ve 256 tokens de um ceu cuja fronteira de Kt
# 0,55-0,65 e nuvem fina e aureola do sol. Aqui: DINOv2 S/14 a 504 px (36 x 36 =
# 1296 tokens, 5x), image_only, alvo no k*, jitter de exposicao desligado,
# batch 8 para caber nos 8 GB, cosseno de 30 epocas (os minimos de validacao
# cairam sempre antes da 30). Sem EMA: inerte nas duas filas anteriores.
# Augment aplicado apos a fila 4 (2026-09-07 20:05): jitter de exposicao religado e
# C-Mixup (alpha 1, bandwidth 0,05, p 0,5) — o unico degrau que regularizou sem
# subajustar e deixou a difusa sem vies (ceuaug3: DHI 18,46, MBE -0,1). Rotacao
# ficou de fora: melhora o ceu (+0,02 bal, parc-clara 0,35 -> 0,41) mas custa 3 a
# 6 W/m2 na difusa (ceuaug2/4); e a alavanca de um modelo especialista em ceu,
# nao de um braco que precisa medir a resolucao nas duas tarefas.
extends: [../_base.yaml, ../../models/image_only.yaml]
name: ceures504_s42
output_dir: output/allsky-mm/experiments/ceures504/ceures504_s42
seed: 42
features:
  set: bare
data:
  data_root: output/allsky-mm/dataset-iso-20260906
  input_mode: image
targets:
  dhi:
    enabled: true
    loss: mae
    weight: 1.0
    parameterization: clearsky_index
  kindex:
    enabled: true
    kind: kstar
    loss: mae
    weight: 1.0
  sky:
    enabled: true
    weight: 0.25
model:
  image_size: 504
  backbone_frozen: false
  unfreeze_last_n: 12
  backbone_pooling: cls+mean
train:
  cmixup:
    enabled: true
    alpha: 1.0
    bandwidth: 0.05
    p: 0.5
  batch_size: 8
  backbone_lr: 0.00001
  epochs: 30
  weight_decay: 0.05
  num_workers: 8
  early_stopping:
    patience: 30
    monitor: val/kindex_mae
augmentation:
  p_exposure: 0.5
  exposure_log2: 0.6
  p_noise: 0.3
  noise_sigma: 0.01
  p_erase: 0.25
