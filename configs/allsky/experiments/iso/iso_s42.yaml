# The isotropic re-extraction: a fisheye disc that is actually round.
#
# Resizing 1920x1080 straight to 512x512 squashes the horizontal axis by 1.78,
# so the dome reaches the model as an ellipse, and every construct that assumes
# the optics — a circular ROI mask, the sun-centred polar unwrapping of
# allsky.augmentation.polar_unwrap, any per-pixel geometry map — then describes
# an image the camera never produced. This arm rebuilds the dataset through the
# crop/pad of configs/allsky/data/local_prepare_iso.yaml, which carries the lens
# fit (415 sun detections over 9 days, equidistant law, 6.67 px median residual)
# and leaves the disc concentric and inscribed: radius 256 at (256, 256) in the
# 512 px frame, and radius 112 at (112, 112) once the 224 px model input squares
# it. In those coordinates centre and radius are analytic; the only fitted term
# left is the mount rotation.
#
# Held against loss_mae, which differs in data.data_root and in nothing else.
# Three seeds each, over the SAME 7,138 test rows — compared sample id by sample
# id, not by count. control / exposure / shuffled ran on a 7,122-row subset of
# those rows, so they are not a valid reference for this arm:
#
#   iso       19.94 +/- 0.35 W/m2 test DHI RMSE   MAE 13.94   MBE -8.30
#   loss_mae  19.63 +/- 0.60
#
# The error does not move — a fine-tuned backbone absorbs a fixed anisotropy.
# What the arm buys is downstream: polar unwrapping, angular coordinates and
# per-pixel geometry channels are only well defined on frames whose disc is
# round. Note that this dataset's manifest does NOT carry log2_exposure_s /
# log2_relative_radiance; an arm that needs the exposure has to reproduce them.
extends: [../_base.yaml, ../../models/image_only.yaml]
name: iso_s42
output_dir: output/allsky-mm/experiments/iso/iso_s42
seed: 42
features:
  set: bare
data:
  data_root: output/allsky-mm/dataset-iso
  input_mode: image
targets:
  dhi:
    loss: mae
  kindex:
    enabled: false
  sky:
    enabled: false
model:
  backbone_frozen: false
  unfreeze_last_n: 12
train:
  backbone_lr: 0.00001
  epochs: 40
  num_workers: 8
