# ceuaug3: o ceuaug2 mais C-Mixup (Yao et al. 2022, NeurIPS, arXiv:2210.05775).
# Mudanca unica contra o ceuaug2:
# - train.cmixup: metade dos batches (p 0.5) e misturada; cada linha ganha um par
#   do mesmo batch sorteado com peso exp(-(k*_i - k*_j)^2 / (2 * 0.05^2)), entao
#   so ceus de k* parecido se misturam e o rotulo interpolado continua fazendo
#   sentido — o mixup uniforme misturaria um ceu encoberto com um limpo e
#   rotularia o resultado com a media; lambda ~ Beta(1, 1), o uniforme do artigo.
#   Imagem, features e alvos de regressao entram lineares; a classe de ceu vira
#   rotulo suave lambda * onehot_i + (1 - lambda) * onehot_j.
extends: [../_base.yaml, ../../models/image_only.yaml]
name: ceuaug3_s42
output_dir: output/allsky-mm/experiments/ceuaug/ceuaug3_s42
seed: 42
features:
  set: bare
data:
  data_root: output/allsky-mm/dataset-iso-20260906
  input_mode: image
targets:
  dhi:
    enabled: true
    loss: mae
    weight: 1.0
    parameterization: clearsky_index
  kindex:
    enabled: true
    kind: kstar
    loss: mae
    weight: 1.0
  sky:
    enabled: true
    weight: 0.25
model:
  backbone_frozen: false
  unfreeze_last_n: 12
  backbone_pooling: cls+mean
  geometry_channels: [cos_sun_angle]
train:
  backbone_lr: 0.00001
  epochs: 30
  weight_decay: 0.05
  num_workers: 8
  early_stopping:
    patience: 30
    monitor: val/kindex_mae
  cmixup:
    enabled: true
    alpha: 1.0
    bandwidth: 0.05
    p: 0.5
augmentation:
  p_exposure: 0.5
  exposure_log2: 0.6
  p_noise: 0.3
  noise_sigma: 0.01
  p_erase: 0.25
  p_translate: 0.5
  translate_px: 8
  p_rotate: 1.0
  rotate_max_deg: 180
