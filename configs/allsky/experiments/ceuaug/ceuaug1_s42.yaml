# ceuaug1: a receita image_only do ceures504 de volta a 224 px, com a augmentation
# fotometrica religada. Todos os bracos anteriores sobreajustam — train loss
# 0,07-0,25 e validacao piorando da epoca 5-14 em diante — e Steiner et al. 2022
# (arXiv:2106.10270) mostram que, com poucos dados, regularizacao e augmentation
# substituem dados para um ViT. Mudancas contra o ceures504:
# - image_size 224 (padrao): a resolucao nativa nao mexeu, e a 224 cabe batch 64;
# - p_exposure 0.5 / exposure_log2 0.6: o jitter de exposicao volta, mais largo,
#   porque a auto-exposicao da camera varia 1340x no dia e o alvo e o k*;
# - p_noise 0.3 / p_erase 0.25 ficam como no ceures504; p_translate 0 aqui, o
#   deslocamento entra no ceuaug2 junto com o canal solar que o acompanha;
# - 30 epocas, monitor val/kindex_mae, sem EMA: inerte nas duas filas anteriores.
extends: [../_base.yaml, ../../models/image_only.yaml]
name: ceuaug1_s42
output_dir: output/allsky-mm/experiments/ceuaug/ceuaug1_s42
seed: 42
features:
  set: bare
data:
  data_root: output/allsky-mm/dataset-iso-20260906
  input_mode: image
targets:
  dhi:
    enabled: true
    loss: mae
    weight: 1.0
    parameterization: clearsky_index
  kindex:
    enabled: true
    kind: kstar
    loss: mae
    weight: 1.0
  sky:
    enabled: true
    weight: 0.25
model:
  backbone_frozen: false
  unfreeze_last_n: 12
  backbone_pooling: cls+mean
train:
  backbone_lr: 0.00001
  epochs: 30
  weight_decay: 0.05
  num_workers: 8
  early_stopping:
    patience: 30
    monitor: val/kindex_mae
augmentation:
  p_exposure: 0.5
  exposure_log2: 0.6
  p_noise: 0.3
  noise_sigma: 0.01
  p_erase: 0.25
  p_translate: 0.0
