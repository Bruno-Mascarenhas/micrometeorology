# ceuexp2: a receita do ceuexp (film + fotometro, alvo no k*) com duas correcoes
# vindas dos 18 treinos anteriores. 1. O best passa a ser escolhido por
# val/kindex_mae — a perda composta, mesmo com a CE a 0,25, ainda subia com a CE
# e fixava o best nas epocas 3-5, e o last servia melhor tudo. 2. Media
# exponencial de pesos (Polyak) gravada como ema.ckpt: o checkpoint de uma
# epoca e ruido do tamanho da diferenca entre sementes.
extends: [../_base.yaml, ../../models/film.yaml]
name: ceuexp2_s44
output_dir: output/allsky-mm/experiments/ceuexp2/ceuexp2_s44
seed: 44
features:
  set: bare
  extra: [log2_exposure_s, log2_relative_radiance]
data:
  data_root: output/allsky-mm/dataset-iso-20260906-exp
  input_mode: image
targets:
  dhi:
    enabled: true
    loss: mae
    weight: 1.0
    parameterization: clearsky_index
  kindex:
    enabled: true
    kind: kstar
    loss: mae
    weight: 1.0
  sky:
    enabled: true
    weight: 0.25
model:
  backbone_frozen: false
  unfreeze_last_n: 12
  backbone_pooling: cls+mean
train:
  weight_average:
    enabled: true
    decay: 0.999
    start_epoch: 2
  backbone_lr: 0.00001
  epochs: 40
  weight_decay: 0.05
  num_workers: 8
  early_stopping:
    patience: 40
    monitor: val/kindex_mae
augmentation:
  p_exposure: 0.0
  p_noise: 0.3
  noise_sigma: 0.01
  p_erase: 0.25
