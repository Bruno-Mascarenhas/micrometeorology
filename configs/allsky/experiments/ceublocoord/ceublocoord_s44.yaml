# ceubloco + a cabeca de ceu do ceuord: alvo suave ordinal e pesos por classe.
#
# A primeira semente do ceubloco (best pela acuracia balanceada, epoca 28)
# mediu, por bloco: bal_acc 0,731, macro-F1 0,721, kappa 0,845 — um modelo so
# empata com o ensemble de tres do ceuord — e difusa RMSE 15,67 com skill contra
# a persistencia do bloco anterior +0,41. O que ficou para tras e a calibracao:
# ECE 0,157 e NLL 1,31, com a CE de validacao subindo de 0,56 (epoca 2) a 1,38
# (epoca 60) — exatamente o regime que o ceuord corrigiu por frame (ECE 0,05,
# +2,5 pt de acuracia balanceada, recall de parcial-claro 0,35 -> 0,53).
#
# Este braco poe as duas correcoes juntas: a unidade do rotulo (sensor_block,
# uma amostra por bloco) e a cabeca ordinal balanceada (ordinal_tau 0,4, pesos
# inverso-frequencia 0,648/1,028/1,845/0,478). Difere do ceubloco SO em
# targets.sky. Controle pareado: ceubloco (por bloco). Nao e ablacao do
# ceublocostd, que testa o pooling; a combinacao dos tres vem depois.
#
# A unidade do treino e a do rotulo: uma amostra = os frames de UMA linha do CR5000.
#
# O que o ceu mediu e que este braco ataca — e e o unico que MOVE O TETO:
#
# O rotulo sky_class e o Kt da media de 5 min END-stampada de uma linha do
# datalogger, atribuido aos 4-5 frames de 1 min daquela janela (verificado em
# dataset-iso: 9.538 blocos, target_dhi constante em 100 % deles). Um frame ve o
# ceu INSTANTANEO, o rotulo e a MEDIA. Um oraculo com o Kt instantaneo perfeito,
# medido na tabela de 1 min de 2024 (74.250 minutos) contra esse rotulo, faz
# macro-F1 0,73 na mistura do teste — e o ceu (0,70) ja esta a 96 % disso. O mesmo
# oraculo POR BLOCO: 0,84 com janela centrada no frame, 0,84-0,99 com a janela
# alinhada ao bloco. A classe parcial-claro (0,10 de largura em Kt) tem sigma do
# Kt instantaneo de 0,14 dentro dela: nao e aprendivel por frame.
#
# alignment.strategy: sensor_block agrupa exatamente os frames que compartilham
# a linha do logger (ceil do carimbo local a 5 min) e faz a media das
# codificacoes pelo caminho de janela do ImageEncoder. one_sample_per_block
# mantem, no treino e na validacao, so o frame mais proximo do centroide do bloco
# (end - 2,5 min): os forwards por epoca ficam iguais aos do ceu, os passos do
# otimizador caem 5x, por isso epochs 60 (cosseno completo, paciencia 60). O teste
# O best.ckpt e escolhido pela ACURACIA BALANCEADA de ceu na validacao
# (monitor val/sky_balanced_acc, modo max): no ceu e no ceuord o val/loss composto
# travou o best na epoca 2-3 e o last perdeu 2-4 pontos de recall nas classes
# parciais — o que melhora no fim do treino sao a difusa e as classes
# majoritarias, o que degrada e o recall das minoritarias, e a acuracia
# balanceada e a media dos recalls. Com paciencia = teto ela so escolhe o
# checkpoint, nao para o treino; o last e avaliado do mesmo jeito. A predicao
# continua por frame no predictions.parquet; a agregacao por bloco e feita no
# ensemble (score_by_sensor_block), com IC bootstrap por bloco e a baseline do
# bloco anterior (0,67 — a persistencia de 1 min, 0,91, e artefato: 79 % dos
# minutos consecutivos partilham a linha).
#
# Um item = 4-5 frames, entao o batch de 64 do ceu viraria 320 imagens por
# forward e nao cabe nos 8 GiB da RTX 2060 (o ceu usa 3,75 GiB com 64 frames).
# batch_size 16 = 80 frames por passo, ~5 GiB. O learning rate segue a regra da
# raiz quadrada para otimizadores adaptativos (Malladi et al. 2022,
# arXiv:2205.10287): lr x sqrt(16/64) = 0,5 -> 1,5e-4 na cabeca e 5e-6 no
# backbone. Com 6.364 blocos de treino sao ~400 passos por epoca, 24k em 60.
#
# Tudo o mais e o ceu: multitarefa sky + k* + difusa em clearsky_index, cls+mean,
# wd 0,05, jitter/ruido/erase, dataset-iso. Difere so em data.alignment, no
# batch/lr que a memoria impoe e no horizonte. Controle pareado: ceu (por frame
# E por bloco); piso de decisao 0,03 de macro-F1 (bootstrap por bloco).
extends: [../_base.yaml, ../../models/image_only.yaml]
name: ceublocoord_s44
output_dir: output/allsky-mm/experiments/ceublocoord/ceublocoord_s44
seed: 44
features:
  set: bare
data:
  data_root: output/allsky-mm/dataset-iso
  input_mode: image
  alignment:
    strategy: sensor_block
    window_minutes: 5.0
    max_frames: 5
    one_sample_per_block: true
targets:
  dhi:
    enabled: true
    loss: mae
    weight: 1.0
    parameterization: clearsky_index
  kindex:
    enabled: true
    kind: kstar
    loss: mae
    weight: 1.0
  sky:
    enabled: true
    weight: 1.0
    class_weights: [0.648, 1.028, 1.845, 0.478]
    ordinal_tau: 0.4
model:
  backbone_frozen: false
  unfreeze_last_n: 12
  backbone_pooling: cls+mean
train:
  lr: 0.00015
  backbone_lr: 0.000005
  batch_size: 16
  epochs: 60
  weight_decay: 0.05
  num_workers: 8
  early_stopping:
    patience: 60
    monitor: val/sky_balanced_acc
augmentation:
  p_exposure: 0.5
  exposure_log2: 0.6
  p_noise: 0.3
  noise_sigma: 0.01
  p_erase: 0.25
