version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  # Without this the ruff pin in .pre-commit-config.yaml drifts from the one in
  # uv.lock, and CI — which lints through pre-commit — silently keeps linting
  # with the older ruff after every dependabot bump.
  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
